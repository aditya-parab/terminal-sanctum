[package]
name = "terminal-sanctum"
version = "0.1.0"
edition = "2024"

[lib]
name = "sanctum_core"
path = "src/lib.rs"

[[bin]]
name = "sanctum"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.26", features = ["all-widgets"] }
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
walkdir = "2.4"
directories = "5.0"
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"
